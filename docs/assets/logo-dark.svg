<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24">
  <!-- Inactive grid: the four corners, hollow and faint. -->
  <g fill="none" stroke="#f7f5f4" stroke-opacity=".28" stroke-width=".75">
    <circle cx="3" cy="3" r="2.625"/>
    <circle cx="21" cy="3" r="2.625"/>
    <circle cx="3" cy="21" r="2.625"/>
    <circle cx="21" cy="21" r="2.625"/>
  </g>
  <!-- The glider: wing row and tail. -->
  <g fill="#f7f5f4">
    <circle cx="3" cy="12" r="3"/>
    <circle cx="12" cy="12" r="3"/>
    <circle cx="21" cy="12" r="3"/>
    <circle cx="12" cy="21" r="3"/>
  </g>
  <!-- The nose. -->
  <circle cx="12" cy="3" r="2.325" fill="none" stroke="#d4551f" stroke-width="1.35"/>
</svg>
