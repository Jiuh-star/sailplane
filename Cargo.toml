[package]
name = "sailplane"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A feature-complete web UI for Headscale, reimplemented in Rust + Vue"

[[bin]]
name = "sailplane"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
axum = { version = "0.8", features = ["macros", "json", "ws"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
hyperlocal = "0.9.1"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
libc = "0.2.190"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "http2",
    "charset",
    "gzip",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
rust-embed = { version = "8", default-features = false, features = ["include-exclude"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "time", "sync", "process", "io-util"] }
tokio-socks = "0.5.3"
# Only `limit`: assets are pre-compressed at build time, so no runtime
# compression, and the API is same-origin so no CORS layer.
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
