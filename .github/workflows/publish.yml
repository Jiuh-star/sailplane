name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # The registry path must be lowercase. Do not use github.repository here:
  # it is Jiuh-star/sailplane.
  IMAGE: ghcr.io/jiuh-star/sailplane

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The binary reports CARGO_PKG_VERSION. A release tag must match it.
      - name: Check the tag against Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml ${crate_version}"
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Each architecture pushes by digest. The merge job joins the digests
      # into one multi-architecture manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }},ignore-error=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge the manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The pattern keeps the build records of build-push-action out of the
      # digest directory.
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create the multi-architecture manifest
        if: steps.meta.outputs.tags != ''
        working-directory: /tmp/digests
        run: |
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no digests were downloaded"
            exit 1
          fi
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Verify the platforms
        run: |
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform.architecture' | sort -u

      # A minimal configuration proves that the image starts and that the
      # frontend is embedded. Headscale stays unreachable on purpose.
      - name: Smoke test the image
        run: |
          cat > /tmp/smoke.yaml <<'YAML'
          server:
            cookie_secret: "0123456789abcdef0123456789abcdef"
            data_path: /tmp/data
          headscale:
            url: http://127.0.0.1:1
          YAML
          docker run -d --name smoke -p 3000:3000 \
            -v /tmp/smoke.yaml:/etc/sailplane/config.yaml:ro \
            "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/admin/ -o /tmp/index.html && break
            sleep 1
          done
          if ! grep -q 'assets/index-' /tmp/index.html; then
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke
