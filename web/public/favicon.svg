<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24">
  <style>
    .plate { fill: #f9f7f6 }
    .grid  { stroke: #1f1e1e }
    .body  { fill: #1f1e1e }
    .nose  { stroke: #b7410e }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #181717 }
      .grid  { stroke: #f7f5f4 }
      .body  { fill: #f7f5f4 }
      .nose  { stroke: #d4551f }
    }
  </style>
  <rect class="plate" width="24" height="24" rx="5.5"/>
  <g transform="translate(12 12) scale(.72) translate(-12 -12)">
    <!-- Inactive grid: the four corners, hollow and faint. -->
    <g class="grid" fill="none" stroke-opacity=".28" stroke-width=".75">
      <circle cx="3" cy="3" r="2.625"/>
      <circle cx="21" cy="3" r="2.625"/>
      <circle cx="3" cy="21" r="2.625"/>
      <circle cx="21" cy="21" r="2.625"/>
    </g>
    <!-- The glider: wing row and tail. -->
    <g class="body">
      <circle cx="3" cy="12" r="3"/>
      <circle cx="12" cy="12" r="3"/>
      <circle cx="21" cy="12" r="3"/>
      <circle cx="12" cy="21" r="3"/>
    </g>
    <!-- The nose. -->
    <circle class="nose" cx="12" cy="3" r="2.325" fill="none" stroke-width="1.35"/>
  </g>
</svg>
